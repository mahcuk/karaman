<!doctype html>

<style>
:root{--ink:#182028;--dark:#15191e;--muted:#66717c;--paper:#fff;--bg:#f3f5f7;--line:#dfe3e6;--gold:#b98216;--green:#2f7d46;--red:#b3261e;--blue:#225b8f}
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:var(--bg);color:var(--ink);padding-bottom:80px}header{background:var(--dark);color:#fff;padding:18px 16px;position:sticky;top:0;z-index:10}header h1{font-size:22px;margin:0 0 4px}header .sub{font-size:13px;opacity:.82}.nav{display:flex;gap:7px;overflow:auto;padding:9px;background:#fff;position:sticky;top:76px;z-index:9;border-bottom:1px solid var(--line)}.nav button,.btn{border:0;border-radius:12px;padding:11px 12px;font-weight:800;font-size:14px}.nav button{white-space:nowrap}.on,.dark{background:var(--dark)!important;color:#fff}.card{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:15px;margin:10px}.hero{background:linear-gradient(135deg,#fff,#f8f3e7);border-left:5px solid var(--gold)}h2{margin:2px 0 7px;font-size:23px}.lead{font-size:14px;line-height:1.5}.muted,small{color:var(--muted)}.notice{margin:10px;padding:12px;background:#fff7df;border:1px solid #ead59a;border-radius:12px;font-size:13px;line-height:1.45}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#f7f8f9;border-radius:12px;padding:9px;text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--muted)}.stop{position:relative}.stop.done{border-left:5px solid var(--green)}.stop.skip{border-left:5px solid var(--red);opacity:.78}.time{font-weight:950;font-size:18px}.name{font-weight:900;font-size:17px;margin-top:3px}.meta{font-size:12px;color:var(--muted);margin:5px 0}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:9px}.good{background:#dff1e2}.bad{background:#fde2df}.blue{background:#e3eef8}.route{display:block;text-align:center;margin-top:8px;text-decoration:none}.details{margin-top:10px;border-top:1px solid var(--line);padding-top:9px}.details b{display:block;margin-bottom:4px}.details p{font-size:13px;line-height:1.52;margin:7px 0}.tips{display:grid;gap:6px}.tip{background:#f7f8f9;border-radius:10px;padding:9px;font-size:12px;line-height:1.4}.tip b{display:inline}.food{border-left:4px solid #c28a22}.checklist label{display:block;padding:8px 0;font-size:13px}.checklist input{margin-right:8px}.textarea{width:100%;box-sizing:border-box;margin-top:9px;min-height:62px;border:1px solid #cfd5da;border-radius:10px;padding:9px;font:inherit}.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--dark);padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:7px;z-index:20}.bottom button{padding:13px;border:0;border-radius:12px;font-weight:900}.mini{font-size:11px}.routefull{display:block;width:calc(100% - 20px);margin:10px;padding:13px;border:0;border-radius:13px;background:var(--blue);color:#fff;font-weight:900;text-align:center;text-decoration:none}.tools button{margin:4px 4px 0 0}.source{font-size:11px;color:var(--muted);line-height:1.4}
</style>
</head>
<body>
<header><h1>Karaman Gezi Kontrol</h1><div class="sub">Başlangıç / dönüş: İkinci İstasyon Caddesi No:241 • Yaşlı misafirler için kontrollü tempo</div></header>
<div class="nav" id="nav"></div><main id="app"></main>
<div class="bottom"><button onclick="tools()">⚙ Araçlar</button><button onclick="pdf()">📄 Gün Sonu PDF</button></div>
<script>
const A='İkinci İstasyon Caddesi No:241, Karaman, Türkiye';
const D=[
['Pazartesi','Karaman tarihi • Taşkale • Manazan','Orta / kontrollü',[ 
['Karaman Kalesi','09:15','09:50','drive','Karaman Kalesi, Karaman','Şehri yukarıdan görmek ve Karaman tarihine giriş. Kalede acele etmeyin; yaşlı misafirler için araçtan iniş ve kısa seyir molası verin.','35 dk'],
['Aktekke Camii / Mümine Hatun Türbesi','10:05','10:35','walk','Aktekke Camii, Karaman','Mevlâna’nın annesi Mümine Hatun’un kabri için ziyaret. Sessiz ve kısa bir ziyaret planlayın; cami adabına uygun hareket edin.','30 dk'],
['Yunus Emre Camii ve Türbesi','10:40','11:10','walk','Yunus Emre Camii ve Türbesi, Karaman','Yunus Emre’nin Karaman ile bağını konuşmak için rehberlik durağı. Oturup dinlenmek için zamanı kullanın.','30 dk'],
['Tartan Konağı','11:15','12:00','walk','Tartan Konağı, Karaman','1810 tarihli konağın planını ve kalem işi süslemelerini inceleyin. İçeride rehberli anlatım varsa 40–45 dakikayı geçirmeyin.','45 dk'],
['Öğle yemeği • yöresel tatlar','12:05','13:20','drive','Öz Karaman Yemek, Karaman','Öncelik: yaşlı misafirlerin rahat oturması, tuvalet ve servis hızıdır. Calla bulunuyorsa tadılabilir; etli ekmek daha kolay ve hızlı seçenektir.','75 dk'],
['Taşkale Tahıl Ambarları','14:05','15:00','drive','Taşkale Tahıl Ambarları, Karaman','Kaya içine oyulmuş 250’den fazla ambarın bulunduğu alanı seyir noktalarından görün. Tırmanma/denge gerektiren bölümlerde zorlamayın.','55 dk'],
['Manazan Mağaraları','15:15','16:00','drive','Manazan Mağaraları, Karaman','Beş katlı kaya yerleşimini dışarıdan ve güvenli erişim noktalarından inceleyin. Dar, eğimli veya güvenli olmayan bölümlere girmeyin.','45 dk'],
['Karaman’a dönüş • dinlenme','16:00','17:00','drive',A,'Günün son ayağı. Otele/ev konumuna dönün. Akşamı boş bırakmak bilinçli bir tercih: yaşlı misafirlerin toparlanması için program burada biter.','60 dk']
],
['Salı','Konya • Mevlâna • Şems • merkez','Orta / şehir içi',[ 
['Karaman → Konya','08:00','09:30','drive','Mevlana Müzesi, Konya','Kahvaltı sonrası tek parça sürüş. Yol üzerinde kısa ihtiyaç molası verilebilir. Konya’ya girince otoparkı önceleyin; şehir merkezinde yürümeyi azaltın.','90 dk'],
['Mevlâna Müzesi / Dergâh','09:30','11:00','walk','Mevlana Müzesi, Konya','Gezinin ana ziyareti. Türbe, dergâh bölümleri ve avluyu sakin tempoda gezin. Yaşlı misafirler için oturma ve su molaları planlayın.','90 dk'],
['Dinlenme • su • tuvalet','11:00','11:20','walk','Mevlana Müzesi, Konya','Herkesin toplandığından emin olun. Bu mola programın parçasıdır; atlanmaması önerilir.','20 dk'],
['Şems-i Tebrizi Türbesi','11:20','12:00','walk','Şems-i Tebrizi Türbesi, Konya','Kısa ziyaret ve dinlenme. Yürüyüş zor gelirse araçla yaklaşım tercih edilebilir.','40 dk'],
['Aziziye Camii','12:00','12:25','walk','Aziziye Camii, Konya','Kısa mimari durak. Uzun anlatım yerine dış cephe ve iç mekânı sakin biçimde görün.','25 dk'],
['Öğle yemeği • Konya mutfağı','12:30','13:40','drive','Halk Etliekmek, Konya','Etli ekmek veya fırın kebabı. Kalabalık/servis durumuna göre alternatif seçin; amaç yemeği uzatmadan dinlenmek.','70 dk'],
['Karatay Medresesi','13:50','14:35','drive','Karatay Medresesi, Konya','Çini ve Selçuklu mimarisine odaklanın. Müze kapalıysa dış cephe ve çevreyle yetinip programı uzatmayın.','45 dk'],
['Alaaddin Tepesi','14:45','15:20','drive','Alaaddin Tepesi, Konya','Kısa seyir ve oturma molası. Uzun yürüyüş yok.','35 dk'],
['Konya → Karaman • dönüş','15:20','17:00','drive',A,'Dönüşte yeni durak eklemeyin. Akşamı serbest bırakın.','100 dk']
],
['Çarşamba','Yerköprü Şelalesi • piknik • doğa','Rahat / doğa günü',[ 
['Karaman → Yerköprü','09:00','10:30','drive','Yerköprü Şelalesi, Hadim, Konya','Kahvaltıdan sonra çıkış. Piknik malzemeleri, su, sandalye/katlanır tabure ve uygun ayakkabı kontrolü yapılır.','90 dk'],
['Yerköprü Şelalesi','10:30','11:20','walk','Yerköprü Şelalesi, Hadim, Konya','Manzara noktasına kontrollü yürüyüş. Yaşlı misafirleri öne/arkaya dağıtmayın; grup tek parça ilerlesin.','50 dk'],
['Dinlenme ve çay','11:20','12:00','walk','Yerköprü Şelalesi, Hadim, Konya','Oturma, su, çay ve fotoğraf. Bu süreyi yürüyüşe çevirmeyin.','40 dk'],
['Piknik öğle yemeği','12:00','14:15','walk','Yerköprü Şelalesi, Hadim, Konya','Uzun ve acele etmeyen öğle molası. Çöp poşeti, peçete, su ve sıcak/soğuk içecekleri hazır tutun.','135 dk'],
['Serbest doğa zamanı','14:15','15:00','walk','Yerköprü Şelalesi, Hadim, Konya','Yakın çevrede fotoğraf ve kısa yürüyüş. Islak/kaygan zemine yaklaşmayın; suya girme planı yok.','45 dk'],
['Yerköprü → Karaman • dönüş','15:00','17:00','drive',A,'Dönüşte dinlenme molası verilebilir. Akşamı boş bırakın.','120 dk']
],
['Perşembe','Ermenek • Zeyve Pazarı • Göksu/Baraj manzarası','Uzun yol / rahat',[ 
['Karaman → Ermenek','08:00','10:15','drive','Ermenek, Karaman','Uzun sürüş. Herkes araçta rahat otursun; ihtiyaç halinde plan dışı 10–15 dakikalık mola verilebilir.','135 dk'],
['Ermenek merkez • mola','10:15','10:50','drive','Ermenek, Karaman','Çay/kahve, tuvalet ve kısa ihtiyaç molası.','35 dk'],
['Ermenek → Zeyve Pazarı','10:50','11:35','drive','Zeyve Pazarı, Ermenek, Karaman','Zeyve’ye geçiş. Pazar alanında araçtan indikten sonra grup tek noktada toplanır.','45 dk'],
['Zeyve Pazarı • tanıma','11:35','12:15','walk','Zeyve Pazarı, Ermenek, Karaman','Tarihi çınarlar, su kaynakları, değirmenler ve pazar dokusu. Fotoğraf için serbest ama grup dağılmasın.','40 dk'],
['Dere • su değirmenleri • dinlenme','12:15','12:50','walk','Zeyve Pazarı, Ermenek, Karaman','Su kenarında oturup dinlenme. Kaygan taşlara ve dere yatağına yaklaşmayın.','35 dk'],
['Öğle yemeği • Zeyve','12:50','14:10','walk','Zeyve Pazarı, Ermenek, Karaman','Yörede ne tazeyse onu tercih edin. Zeyve kebabı varsa denenebilir. Uzun oturma molası özellikle yaşlılar için faydalı.','80 dk'],
['Çay • serbest zaman','14:10','14:45','walk','Zeyve Pazarı, Ermenek, Karaman','Programın temposunu düşüren bilinçli mola. Alışveriş/yöresel ürün için de kullanılabilir.','35 dk'],
['Zeyve → Ermenek Barajı','14:45','15:30','drive','Ermenek Barajı, Karaman','Manzara için araçla geçiş. Yol ve görüş şartlarına göre seyir noktası seçilir.','45 dk'],
['Göksu / Turkuaz su manzarası','15:30','16:15','walk','Ermenek Barajı, Karaman','Kısa seyir, fotoğraf ve oturma. Kenarlarda güvenli sınırların dışına çıkmayın.','45 dk'],
['Ermenek → Karaman • dönüş','16:15','19:00','drive',A,'Perşembe uzun gün. Cuma ayrılış olduğu için akşam ekstra program koymuyoruz.','165 dk']
]
];
let day=+(localStorage.kday||0), S=JSON.parse(localStorage.kstate||'{}');
function key(i){return day+'_'+i}function g(i){return S[key(i)]||{s:'Planlandı',d:0,n:''}}
function save(){localStorage.kday=day;localStorage.kstate=JSON.stringify(S)}
function min(t){let a=t.split(':').map(Number);return a[0]*60+a[1]}function hh(n){n=(n+1440)%1440;return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function timing(i){let shift=0;for(let j=0;j<i;j++){let q=g(j);if(q.s!=='Atlandı')shift+=q.d||0}let x=D[day][2][i];return[hh(min(x[1])+shift),hh(min(x[2])+shift),shift]}
function mapUrl(i){let x=D[day][2][i],origin=i===0?A:D[day][2][i-1][4];return'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(origin)+'&destination='+encodeURIComponent(x[4])+'&travelmode='+(x[3]==='walk'?'walking':'driving')}
function fullRoute(){let arr=[A,...D[day][2].map(x=>x[4])];return'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(arr[0])+'&destination='+encodeURIComponent(arr[arr.length-1])+'&waypoints='+arr.slice(1,-1).map(encodeURIComponent).join('|')+'&travelmode=driving'}
function set(i,p){S[key(i)]={...g(i),...p};save();render()}
function progress(){let all=D[day][2].length,done=D[day][2].filter((_,i)=>g(i).s==='Yapıldı').length,skip=D[day][2].filter((_,i)=>g(i).s==='Atlandı').length;return{all,done,skip,left:all-done-skip}}
function render(){let d=D[day],p=progress();nav.innerHTML=D.map((x,i)=>'<button class="'+(i===day?'on':'')+'" onclick="day='+i+';save();render()">'+x[0]+'</button>').join('');
let intro='<section class="card hero"><h2>'+d[1]+'</h2><div class="lead">Bu günün planı misafirlere rehber anlatımı yapıyormuş gibi düzenlendi. Saatler başlangıç planıdır; yaşlı misafirlerin durumuna göre <b>Atla</b> veya <b>+15 dk</b> kullanabilirsiniz.</div><div class="stats" style="margin-top:10px"><div class="stat"><b>'+p.done+'</b><span>Yapıldı</span></div><div class="stat"><b>'+p.left+'</b><span>Kalan</span></div><div class="stat"><b>'+p.skip+'</b><span>Atlandı</span></div></div></section>';
let notice='<div class="notice"><b>Tempo kuralı:</b> 45–60 dakikadan uzun yürüyüş/ziyaret sonrası en az 10–20 dakika oturma planlanır. Yaşlı misafirlerden biri yorulursa programı zorlamak yerine bir sonraki durağı atlayın. <b>Atla</b> o durağın süresini kaldırır; <b>+15 dk</b> o noktadan sonrasını kaydırır.</div><a class="routefull" target="_blank" href="'+fullRoute()+'">🗺️ Günün tam araba rotasını aç</a>';
let cards=d[2].map((x,i)=>{let q=g(i),z=timing(i),c=q.s==='Yapıldı'?'done':q.s==='Atlandı'?'skip':'';let food=x[0].toLowerCase().includes('yemek')?' food':'';return'<section class="card stop '+c+food+'"><div class="time">'+(q.s==='Atlandı'?x[1]+' – '+x[2]:z[0]+' – '+z[1])+'</div><div class="name">'+(i+1)+'. '+x[0]+'</div><div class="meta">'+(x[3]==='walk'?'🚶 Yürüyüş':'🚗 Araç')+' • '+q.s+(z[2]?' • program kayması +'+z[2]+' dk':'')+'</div><div class="details"><b>Burada ne yapacağız?</b><p>'+x[5]+'</p><div class="tips"><div class="tip"><b>Süre:</b> '+x[6]+'</div><div class="tip"><b>Grup yönetimi:</b> Önce yaşlı misafirlerin oturacağı/nefesleneceği noktayı belirleyin. Fotoğraf ve kişisel gezinti bundan sonra.</div>'+(food?'<div class="tip"><b>Yemek tercihi:</b> Yöresel yemekleri deneyin; servis gecikirse tüm programı bozmamak için daha hızlı alternatife geçin.</div>':'')+'</div></div><div class="actions"><button class="btn" onclick="set('+i+', {s:\'Aktif\'})">▶ Aktif</button><button class="btn good" onclick="set('+i+', {s:\'Yapıldı\'})">✓ Yapıldı</button><button class="btn bad" onclick="set('+i+', {s:\'Atlandı\'})">✕ Atla</button><button class="btn" onclick="set('+i+', {d:(g('+i+').d||0)+15})">+15 dk</button></div><a class="btn dark route" target="_blank" href="'+mapUrl(i)+'">📍 Bu durağa rotayı aç</a><textarea class="textarea" placeholder="Bu alanı şu işler için kullanın: ne yedik, kim yoruldu, hangi durak atlandı, park yeri, harcama, önemli telefon, bir sonraki güne not..." onchange="set('+i+', {n:this.value})">'+q.n+'</textarea></section>'}).join('');
let extras='<section class="card"><h3>Günün yönetim notları</h3><div class="checklist"><label><input type="checkbox" '+(S['day'+day+'_water']?'checked':'')+' onchange="S[\'day'+day+'_water\']=this.checked;save()"> Su / ilaç / kişisel ihtiyaç kontrolü yapıldı</label><label><input type="checkbox" '+(S['day'+day+'_toilet']?'checked':'')+' onchange="S[\'day'+day+'_toilet\']=this.checked;save()"> Tuvalet molası planlandı</label><label><input type="checkbox" '+(S['day'+day+'_group']?'checked':'')+' onchange="S[\'day'+day+'_group\']=this.checked;save()"> Grup sayısı ve araç anahtarı kontrol edildi</label><label><input type="checkbox" '+(S['day'+day+'_weather']?'checked':'')+' onchange="S[\'day'+day+'_weather\']=this.checked;save()"> Hava/yol koşulları kontrol edildi</label></div><p class="source">Notlar yalnızca bu telefonda saklanır. Tarayıcı verileri silinirse kayıtlar kaybolabilir.</p></section>';
app.innerHTML=intro+notice+cards+extras}
function tools(){alert('Kullanım: Aktif = mevcut durak. Yapıldı = tamamlandı. Atla = o durağın süresini kaldırır. +15 dk = o duraktan sonraki tüm saatleri 15 dakika ileri alır. Not alanı günlük saha notları içindir. Gün Sonu PDF, gerçekleşen durumu ve notları çıktı olarak verir.')}
function pdf(){let d=D[day],p=progress(),rows=d[2].map((x,i)=>{let q=g(i),z=timing(i);return'<tr><td>'+(i+1)+'</td><td>'+x[0]+'</td><td>'+((q.s==='Atlandı')?x[1]+' – '+x[2]:z[0]+' – '+z[1])+'</td><td>'+q.s+'</td><td>'+x[3]+'</td><td>'+q.n+'</td></tr>'}).join('');let w=open('','_blank');w.document.write('<html><head><title>Karaman Gezi - '+d[0]+'</title><style>body{font-family:Arial;margin:24px;color:#182028}h1{margin-bottom:4px}p{line-height:1.5}.summary{padding:10px;background:#eee;margin:10px 0}table{width:100%;border-collapse:collapse}th,td{border:1px solid #999;padding:7px;font-size:11px;vertical-align:top}th{background:#eee}</style></head><body><h1>KARAMAN GEZİ — GÜN SONU RAPORU</h1><p><b>'+d[0]+'</b><br>'+d[1]+'<br>Başlangıç / dönüş: '+A+'</p><div class="summary">Toplam durak: '+p.all+' • Yapıldı: '+p.done+' • Atlandı: '+p.skip+' • Kalan: '+p.left+'</div><h3>Gerçekleşen program</h3><table><tr><th>#</th><th>Durak</th><th>Saat</th><th>Durum</th><th>Ulaşım</th><th>Not</th></tr>'+rows+'</table><p><b>Hatırlatma:</b> Bu rapor saha sırasında girilen not ve durumları içerir. Saatler plan değişikliklerine göre otomatik hesaplanmıştır.</p></body></html>');w.document.close();w.print()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});render();
</script></body></html>
