<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15191e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Karaman Gezi Kontrol</title>
<style>
:root{--dark:#15191e;--bg:#f3f5f7;--card:#fff;--line:#dfe3e7;--muted:#66717c;--gold:#a96f12;--green:#2f7d46;--red:#b3261e;--blue:#225b8f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#182028;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:82px}header{background:var(--dark);color:#fff;padding:18px 16px;position:sticky;top:0;z-index:20}header h1{font-size:22px;margin:0 0 5px}header p{margin:0;font-size:13px;line-height:1.45;opacity:.86}.days{display:flex;gap:7px;overflow:auto;padding:10px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:91px;z-index:15}.days button{border:0;border-radius:12px;padding:11px 14px;font-weight:800;white-space:nowrap;background:#eee}.days button.active{background:var(--dark);color:#fff}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;margin:10px;padding:15px;box-shadow:0 1px 2px #00000008}.hero{border-left:5px solid var(--gold);background:linear-gradient(135deg,#fff,#faf5e9)}h2{margin:0 0 7px;font-size:23px}.lead{font-size:14px;line-height:1.5}.notice{background:#fff7df;border:1px solid #ead59a;border-radius:12px;padding:12px;margin:10px;font-size:13px;line-height:1.5}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.stat{background:#f7f8f9;border-radius:11px;padding:9px;text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--muted)}.stop h3{margin:3px 0;font-size:18px}.time{font-size:19px;font-weight:900}.meta{font-size:12px;color:var(--muted);margin:5px 0}.details{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}.details p{font-size:13px;line-height:1.55;margin:6px 0}.details strong{display:block;margin-top:9px}.tag{display:inline-block;background:#eef1f4;border-radius:8px;padding:4px 7px;font-size:11px;font-weight:800;margin:3px 3px 0 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.actions button,.route,.bottom button{border:0;border-radius:12px;padding:12px;font-weight:900;font-size:14px;text-align:center}.done{background:#dff1e2}.skip{background:#fde2df}.delay{background:#eee}.active{background:#e3eef8}.route{display:block;text-decoration:none;background:var(--dark);color:#fff;margin-top:8px}.stop.isdone{border-left:5px solid var(--green)}.stop.isskip{border-left:5px solid var(--red);opacity:.7}.note{width:100%;min-height:65px;margin-top:9px;border:1px solid #ccd2d7;border-radius:10px;padding:9px;font:inherit}.tips{display:grid;gap:7px}.tip{background:#f7f8f9;border-radius:10px;padding:10px;font-size:12px;line-height:1.45}.food{border-left:4px solid var(--gold)}.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--dark);padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px;z-index:30}.bottom button{background:#fff;color:#182028}.small{font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<header><h1>Karaman Gezi Kontrol</h1><p>Başlangıç / dönüş: İkinci İstasyon Caddesi No:241<br>Yaşlı misafirler için kontrollü tempo • Program gerektiğinde sahada değiştirilebilir</p></header>
<nav class="days" id="days"></nav>
<main id="app"></main>
<div class="bottom"><button onclick="showTools()">⚙ Araçlar</button><button onclick="makePDF()">📄 Gün Sonu PDF</button></div>
<script>
'use strict';
const START='İkinci İstasyon Caddesi No:241, Karaman, Türkiye';
const DATA={
'Pazartesi':{theme:'Karaman tarihi • Taşkale • Manazan',tempo:'Orta / kontrollü',stops:[
['Karaman Kalesi','09:15','09:50','drive','Karaman Kalesi, Karaman','Şehri yukarıdan görmek ve Karaman tarihine giriş. Araçtan indikten sonra kısa seyir molası verin; yaşlı misafirleri yokuşa zorlamayın.','35 dk'],
['Aktekke Camii / Mümine Hatun Türbesi','10:05','10:35','walk','Aktekke Camii, Karaman','Mümine Hatun Türbesi için sakin ve kısa ziyaret. Cami adabına uygun hareket edin; grup girişte ve çıkışta yeniden toplansın.','30 dk'],
['Yunus Emre Camii ve Türbesi','10:40','11:10','walk','Yunus Emre Camii ve Türbesi, Karaman','Kısa tarih anlatımı, ziyaret ve oturma molası. Burayı uzun yürüyüşe çevirmeyin.','30 dk'],
['Tartan Konağı','11:15','12:00','walk','Tartan Konağı, Karaman','Konağın planını, kalem işi süslemelerini ve geleneksel yaşam izlerini inceleyin. Açılış/ziyaret durumunu sahada kontrol edin.','45 dk'],
['Öğle yemeği • yöresel tatlar','12:05','13:20','drive','Karaman merkez','Öncelik rahat oturma, temiz tuvalet ve servis hızıdır. Calla varsa tadılabilir; etli ekmek daha hızlı bir seçenek olabilir.','75 dk'],
['Taşkale Tahıl Ambarları','14:05','15:00','drive','Taşkale Tahıl Ambarları, Karaman','Kaya içine oyulmuş tahıl ambarlarını güvenli seyir noktalarından inceleyin. Tırmanma ve denge gerektiren bölümlerde kimseyi zorlamayın.','55 dk'],
['Manazan Mağaraları','15:15','16:00','drive','Manazan Mağaraları, Karaman','Kaya yerleşiminin yapısını dışarıdan ve güvenli erişim noktalarından görün. Dar, eğimli veya riskli yerlere girmeyin.','45 dk'],
['Karaman’a dönüş • dinlenme','16:00','17:00','drive',START,'Günün son ayağı. Dönüşten sonra yeni gezi eklemeyin; akşamı dinlenmeye bırakın.','60 dk']]},
'Salı':{theme:'Konya • Mevlâna • Şems • merkez',tempo:'Orta / şehir içi',stops:[
['Karaman → Konya','08:00','09:30','drive','Mevlana Müzesi, Konya','Kahvaltı sonrası tek parça sürüş. İhtiyaç halinde kısa mola verin. Konya’da otoparkı önceleyip yürüyüşü azaltın.','90 dk'],
['Mevlâna Müzesi / Dergâh','09:30','11:00','walk','Mevlana Müzesi, Konya','Gezinin ana ziyareti. Türbe, dergâh ve avluyu sakin tempoda gezin. Oturma ve su molalarını ihmal etmeyin.','90 dk'],
['Dinlenme • su • tuvalet','11:00','11:20','walk','Mevlana Müzesi çevresi, Konya','Herkesin toplandığını kontrol edin. Bu mola programın zorunlu parçası kabul edilsin.','20 dk'],
['Şems-i Tebrizi Türbesi','11:20','12:00','walk','Şems-i Tebrizi Türbesi, Konya','Kısa ziyaret. Yürüyüş zor gelirse araçla yaklaşım tercih edilebilir.','40 dk'],
['Aziziye Camii','12:00','12:25','walk','Aziziye Camii, Konya','Kısa mimari durak. Dış cephe ve iç mekânı sakin biçimde görün; uzun anlatım yapmayın.','25 dk'],
['Öğle yemeği • Konya mutfağı','12:30','13:40','drive','Konya merkez','Etli ekmek veya fırın kebabı. Kalabalık ve servis hızına göre alternatif seçin.','70 dk'],
['Karatay Medresesi','13:50','14:35','drive','Karatay Medresesi, Konya','Selçuklu mimarisi ve çini işçiliğine odaklanın. Kapalıysa programı uzatmadan dışarıdan devam edin.','45 dk'],
['Alaaddin Tepesi','14:45','15:20','drive','Alaaddin Tepesi, Konya','Kısa seyir ve oturma molası. Uzun yürüyüş yok.','35 dk'],
['Konya → Karaman • dönüş','15:20','17:00','drive',START,'Dönüşte yeni durak eklemeyin. Akşam serbest.','100 dk']]},
'Çarşamba':{theme:'Yerköprü Şelalesi • piknik • doğa',tempo:'Rahat / doğa günü',stops:[
['Karaman → Yerköprü','09:00','10:30','drive','Yerköprü Şelalesi, Hadim, Konya','Piknik malzemeleri, su, sandalye/katlanır tabure ve uygun ayakkabı kontrolü yapılır.','90 dk'],
['Yerköprü Şelalesi','10:30','11:20','walk','Yerköprü Şelalesi, Hadim, Konya','Manzara noktasına kontrollü yürüyüş. Grup tek parça ilerlesin; yaşlı misafirleri öne/arkaya bırakmayın.','50 dk'],
['Dinlenme ve çay','11:20','12:00','walk','Yerköprü Şelalesi, Hadim, Konya','Oturma, su, çay ve fotoğraf. Bu süreyi tekrar yürüyüşe çevirmeyin.','40 dk'],
['Piknik öğle yemeği','12:00','14:15','walk','Yerköprü Şelalesi, Hadim, Konya','Acele etmeyen uzun mola. Çöp poşeti, peçete, su ve içecekleri hazır tutun.','135 dk'],
['Serbest doğa zamanı','14:15','15:00','walk','Yerköprü Şelalesi, Hadim, Konya','Yakın çevrede fotoğraf ve kısa yürüyüş. Islak/kaygan zemine yaklaşmayın; suya girme planı yok.','45 dk'],
['Yerköprü → Karaman • dönüş','15:00','17:00','drive',START,'Dönüşte ihtiyaç molası verilebilir. Akşamı boş bırakın.','120 dk']]},
'Perşembe':{theme:'Ermenek • Zeyve Pazarı • baraj manzarası',tempo:'Uzun yol / rahat',stops:[
['Karaman → Ermenek','08:00','10:15','drive','Ermenek, Karaman','Uzun sürüş. Araç içinde su ve ihtiyaç kontrolü yapın; gerekirse 10–15 dakikalık ek mola verilebilir.','135 dk'],
['Ermenek merkez • mola','10:15','10:50','drive','Ermenek merkez, Karaman','Çay/kahve, tuvalet ve kısa ihtiyaç molası.','35 dk'],
['Ermenek → Zeyve Pazarı','10:50','11:35','drive','Zeyve Pazarı, Ermenek, Karaman','Pazar alanına geçiş. Araçtan indikten sonra grup tek noktada toplansın.','45 dk'],
['Zeyve Pazarı • tanıma','11:35','12:15','walk','Zeyve Pazarı, Ermenek, Karaman','Tarihi çınarlar, su kaynakları, değirmenler ve pazar dokusunu görün. Fotoğraf için serbest ama grup dağılmasın.','40 dk'],
['Dere • değirmenler • dinlenme','12:15','12:50','walk','Zeyve Pazarı, Ermenek, Karaman','Su kenarında oturun. Kaygan taşlara ve dere yatağına yaklaşmayın.','35 dk'],
['Öğle yemeği • Zeyve','12:50','14:10','walk','Zeyve Pazarı, Ermenek, Karaman','Yörede taze olanı tercih edin. Zeyve kebabı bulunuyorsa denenebilir. Uzun oturma molası özellikle yaşlılar için faydalıdır.','80 dk'],
['Çay • serbest zaman','14:10','14:45','walk','Zeyve Pazarı, Ermenek, Karaman','Temponun düşürüldüğü bilinçli mola. Yöresel ürün alışverişi için de kullanılabilir.','35 dk'],
['Zeyve → Ermenek Barajı','14:45','15:30','drive','Ermenek Barajı, Karaman','Manzara için araçla geçiş. Yol ve görüş şartlarına göre güvenli seyir noktası seçin.','45 dk'],
['Baraj manzarası • fotoğraf','15:30','16:15','walk','Ermenek Barajı, Karaman','Kısa seyir, fotoğraf ve oturma. Kenarlarda güvenli sınırların dışına çıkmayın.','45 dk'],
['Ermenek → Karaman • dönüş','16:15','18:30','drive',START,'Uzun dönüş. Akşam başka program planlamayın.','135 dk']]}
};
let day='Pazartesi';
const state=JSON.parse(localStorage.getItem('karamanState')||'{}');
function save(){localStorage.setItem('karamanState',JSON.stringify(state));}
function key(d,i){return d+'_'+i}
function minutes(t){const p=t.split(':');return Number(p[0])*60+Number(p[1])}
function fmt(n){n=(n+1440)%1440;return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function renderDays(){const el=document.getElementById('days');el.innerHTML='';Object.keys(DATA).forEach(d=>{const b=document.createElement('button');b.textContent=d;b.className=d===day?'active':'';b.onclick=()=>{day=d;render()};el.appendChild(b)})}
function adjusted(d){const arr=DATA[d].stops.map(x=>x.slice());let shift=0;arr.forEach((s,i)=>{const k=key(d,i);if(i>0){s[1]=fmt(minutes(s[1])+shift);s[2]=fmt(minutes(s[2])+shift)}if(state[k]?.skip)shift-=minutes(s[2])-minutes(s[1]);if(state[k]?.delay)shift+=15});return arr}
function routeUrl(from,to){return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(from)+'&destination='+encodeURIComponent(to)+'&travelmode=driving'}
function routeDay(d){const arr=adjusted(d);const pts=[START].concat(arr.map(s=>s[4]));return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(pts[0])+'&destination='+encodeURIComponent(pts[pts.length-1])+'&waypoints='+encodeURIComponent(pts.slice(1,-1).join('|'))+'&travelmode=driving'}
function render(){renderDays();const d=DATA[day],arr=adjusted(day);let done=0,skip=0;arr.forEach((s,i)=>{const x=state[key(day,i)];if(x?.done)done++;if(x?.skip)skip++});let html='<section class="card hero"><h2>'+day+' — '+d.theme+'</h2><div class="lead">Tempo: <b>'+d.tempo+'</b>. Program sahada esnetilebilir; bir durak atlanırsa sonraki saatler otomatik hesaplanır.</div><div class="stats"><div class="stat"><b>'+arr.length+'</b><span>Durak</span></div><div class="stat"><b>'+done+'</b><span>Yapıldı</span></div><div class="stat"><b>'+skip+'</b><span>Atlandı</span></div></div></section>';
html+='<div class="notice"><b>Tur rehberi kuralı:</b> Saatten önce grubun hazır olması, her durakta tekrar toplanması ve yaşlı misafirlerin yorulmadan programı tamamlaması önceliklidir. 15 dakika gecikme sorun değildir; güvenli tempo korunur.</div>';
html+='<a class="route" href="'+routeDay(day)+'" target="_blank">🗺️ Günün araba rotasını aç</a>';
arr.forEach((s,i)=>{const k=key(day,i),x=state[k]||{},cls=x.done?'isdone':(x.skip?'isskip':'');const prev=i===0?START:arr[i-1][4];const next=i<arr.length-1?arr[i+1][4]:START;html+='<article class="card stop '+cls+'"><div class="time">'+s[1]+' – '+s[2]+'</div><h3>'+ (i+1)+'. '+s[0]+'</h3><div class="meta">'+(s[3]==='drive'?'🚗 Araç':'🚶 Yürüyüş')+' • Planlanan süre: '+s[6]+'</div><div class="details"><strong>Burada ne yapacağız?</strong><p>'+s[5]+'</p><strong>Grup yönetimi</strong><p>Bu durakta grup '+(s[3]==='walk'?'yürüyüşte tek parça kalmalı.':'araç çevresinde yeniden toplanmalı.')+' Su, tuvalet ve yorulan misafir kontrolünü yapın.</p><span class="tag">Önceki: '+prev+'</span><span class="tag">Sonraki: '+next+'</span></div><div class="actions"><button class="active" onclick="mark(\''+day+'\','+i+',\'active\')">▶ Aktif</button><button class="done" onclick="mark(\''+day+'\','+i+',\'done\')">✓ Yapıldı</button><button class="skip" onclick="mark(\''+day+'\','+i+',\'skip\')">✕ Atla</button><button class="delay" onclick="mark(\''+day+'\','+i+',\'delay\')">+15 dk</button></div><a class="route" href="'+routeUrl(prev,s[4])+'" target="_blank">📍 Bu durağa rotayı aç</a><textarea class="note" placeholder="Saha notu..." onchange="note(\''+day+'\','+i+',this.value)">'+(x.note||'')+'</textarea></article>'});
html+='<section class="card"><h3>🧭 Günlük kontrol listesi</h3><div class="tips"><div class="tip">☐ Su ve kişisel ihtiyaçlar kontrol edildi.</div><div class="tip">☐ Araç anahtarı / telefon / şarj kontrol edildi.</div><div class="tip">☐ Yaşlı misafirlerin yorgunluk durumu kontrol edildi.</div><div class="tip">☐ Bir sonraki durağın açılış ve yol durumu kontrol edildi.</div><div class="tip">☐ Gün sonunda ek durak eklenmedi; dönüş saati korunuyor.</div></div></section>';
document.getElementById('app').innerHTML=html}
function mark(d,i,type){const k=key(d,i);state[k]=state[k]||{};if(type==='done'){state[k].done=true;state[k].skip=false}else if(type==='skip'){state[k].skip=true;state[k].done=false}else if(type==='delay'){state[k].delay=(state[k].delay?0:15)}else{state[k].active=true}save();render()}
function note(d,i,v){const k=key(d,i);state[k]=state[k]||{};state[k].note=v;save()}
function showTools(){alert('Araçlar\\n\\n• Program değişiklikleri telefonda saklanır.\\n• Atla: o durağın süresini kaldırır ve sonraki programı öne çeker.\\n• +15 dk: sonraki programı 15 dakika kaydırır.\\n• Notlar Gün Sonu PDF çıktısına eklenir.\\n• Harita bağlantıları önceki duraktan sonraki durağa göre açılır.')}
function makePDF(){const d=DATA[day],arr=adjusted(day);let rows='';arr.forEach((s,i)=>{const x=state[key(day,i)]||{};rows+='<div style="page-break-inside:avoid;border-bottom:1px solid #ddd;padding:12px 0"><b>'+s[1]+' – '+s[2]+' | '+(i+1)+'. '+s[0]+'</b><br><small>'+(x.skip?'ATLANDI':x.done?'YAPILDI':'PLAN')+' • '+s[3]+' • '+s[6]+'</small><p>'+s[5]+'</p>'+(x.note?'<p><b>Saha notu:</b> '+escapeHtml(x.note)+'</p>':'')+'</div>'});const w=window.open('','_blank');if(!w){alert('PDF için açılır pencereye izin verin.');return}w.document.write('<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>'+day+' Gün Sonu Raporu</title><style>body{font-family:Arial,sans-serif;max-width:850px;margin:35px auto;line-height:1.5;color:#222}h1{font-size:25px}h2{font-size:18px}p{font-size:13px}small{color:#666}.box{background:#f3f5f7;padding:12px;border-radius:8px}</style></head><body><h1>Karaman Gezi Kontrol — Gün Sonu Raporu</h1><div class="box"><b>'+day+'</b><br>'+d.theme+'<br>Başlangıç / dönüş: '+START+'</div><h2>Gerçekleşen program</h2>'+rows+'<p style="margin-top:30px">Rapor sahadaki işaretlemeler ve notlar esas alınarak oluşturulmuştur.</p><script>window.onload=function(){window.print()}<\/script></body></html>');w.document.close()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(function(){})}
</script>
</body>
</html>
