<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15191e"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>Karaman Gezi Kontrol</title><style>:root{--dark:#15191e;--bg:#f3f5f7;--card:#fff;--line:#dfe3e7;--muted:#66717c;--green:#2f7d46;--red:#b3261e;--blue:#225b8f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#182028;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:80px}header{background:var(--dark);color:#fff;padding:18px 16px;position:sticky;top:0;z-index:20}header h1{margin:0 0 5px;font-size:22px}header p{margin:0;font-size:12px;line-height:1.45}.days{display:flex;gap:7px;overflow:auto;padding:9px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:89px;z-index:15}.days button{border:0;border-radius:12px;padding:11px 14px;font-weight:800;white-space:nowrap;background:#eee}.days button.active{background:var(--dark);color:#fff}.card{background:#fff;border:1px solid var(--line);border-radius:16px;margin:10px;padding:14px;box-shadow:0 1px 2px #0001}.hero{border-left:5px solid #a96f12;background:linear-gradient(135deg,#fff,#faf5e9)}h2{margin:0 0 6px;font-size:22px}.lead{font-size:13px;line-height:1.5}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}.stat{background:#f7f8f9;border-radius:10px;padding:8px;text-align:center}.stat b{display:block;font-size:17px}.stat span{font-size:10px;color:var(--muted)}.stop{border-left:5px solid var(--blue)}.stop.done{border-left-color:var(--green)}.stop.skip{border-left-color:var(--red);opacity:.7}.stop h3{margin:2px 0;font-size:17px}.time{font-size:19px;font-weight:900}.meta{font-size:12px;color:var(--muted);margin:4px 0}.details{border-top:1px solid var(--line);margin-top:9px;padding-top:9px}.details p{font-size:13px;line-height:1.5;margin:5px 0}.details strong{display:block;margin-top:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}.actions button,.route,.add button,.bottom button{border:0;border-radius:11px;padding:11px;font-weight:900;font-size:13px}.doneBtn{background:#dff1e2}.skipBtn{background:#fde2df}.delayBtn{background:#eee}.activeBtn{background:#e3eef8}.route{display:block;text-decoration:none;background:var(--dark);color:#fff;text-align:center;margin-top:7px}.note{width:100%;min-height:60px;margin-top:8px;border:1px solid #ccd2d7;border-radius:9px;padding:9px;font:inherit}.checklist{display:grid;gap:6px;margin-top:9px}.check{display:flex;align-items:center;gap:9px;background:#f7f8f9;border-radius:9px;padding:9px;font-size:13px}.check input{width:21px;height:21px;accent-color:var(--green)}.check.done{text-decoration:line-through;opacity:.6}.add{border:2px dashed #c8ced4}.add input{width:100%;border:1px solid #cbd1d6;border-radius:10px;padding:12px;margin:6px 0;font:inherit}.add button{background:var(--dark);color:#fff;width:100%}.warning{font-size:11px;color:#725700;line-height:1.4;margin-top:6px}.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--dark);padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:7px;z-index:30}.bottom button{background:#fff;color:#182028}@media print{.bottom,.days,.actions,.route,.add{display:none!important}body{background:#fff}.card{break-inside:avoid;box-shadow:none}}</style></head><body><header><h1>Karaman Gezi Kontrol</h1><p>Başlangıç / dönüş: <b>İstasyon Caddesi 241 Sokak No:6, Karaman</b><br>Yaşlı misafirler için kontrollü tempo • Sahada program değiştirilebilir</p></header><nav class="days" id="days"></nav><main id="app"></main><div class="bottom"><button onclick="window.print()">📄 Gün Sonu PDF</button><button onclick="resetDay()">↺ Gün Durumunu Sıfırla</button></div><script>
const START='İstasyon Caddesi 241 Sokak No:6, Karaman, Türkiye';const COORD={[START]:'37.18195,33.22120','Karaman Kalesi, Karaman':'37.182098,33.205250','Aktekke Camii, Karaman':'37.18145,33.21785','Yunus Emre Camii ve Türbesi, Karaman':'37.18240,33.22040','Tartan Konağı, Karaman':'37.18120,33.21830','Mevlana Müzesi, Konya':'37.87135,32.49316','Şems-i Tebrizi Türbesi, Konya':'37.87440,32.49470','Aziziye Camii, Konya':'37.86980,32.49370','Karatay Medresesi, Konya':'37.87040,32.49570','Alaaddin Tepesi, Konya':'37.87290,32.49220','Yerköprü Şelalesi, Hadim, Konya':'37.02867,32.70108','Binbir Kilise, Madenşehri, Karaman':'37.43154,33.11749','Manazan Mağaraları, Karaman':'37.3380,33.1920','Taşkale Tahıl Ambarları, Karaman':'37.0050,33.4280','Ermenek Barajı, Karaman':'36.56806,32.96778'};
const DAYS={Pazartesi:{theme:'Karaman tarihi • türbeler • Taşkale • Manazan',tempo:'Orta / kontrollü',stops:[['Karaman Kalesi','09:15','09:50','Karaman Kalesi, Karaman','Şehre ve kaleye giriş. Kısa seyir ve tarih anlatımı. Yokuşlarda yaşlı misafirleri zorlamayın.'],['Aktekke Camii / Mümine Hatun Türbesi','10:05','10:35','Aktekke Camii, Karaman','Sakin ziyaret. Cami adabına dikkat; giriş ve çıkışta grup yeniden toplansın.'],['Yunus Emre Camii ve Türbesi','10:40','11:10','Yunus Emre Camii ve Türbesi, Karaman','Kısa ziyaret, tarih anlatımı ve oturma molası.'],['Tartan Konağı','11:15','12:00','Tartan Konağı, Karaman','Geleneksel konak mimarisi ve süslemeleri. Ziyaret durumu sahada kontrol edilir.'],['Öğle yemeği • yöresel tatlar','12:05','13:20','Karaman merkez','Rahat oturma, temiz tuvalet ve servis hızı öncelikli. Calla veya etli ekmek tercih edilebilir.'],['Binbir Kilise (Madenşehri)','13:55','14:45','Binbir Kilise, Madenşehri, Karaman','Açık hava tarihî alanı. Su, şapka ve uygun ayakkabı. Yıkıntılara tırmanmayın.'],['Taşkale Tahıl Ambarları','15:15','16:00','Taşkale Tahıl Ambarları, Karaman','Kaya içine oyulmuş ambarları güvenli seyir noktalarından görün.'],['Manazan Mağaraları','16:15','17:00','Manazan Mağaraları, Karaman','Kaya yerleşimini güvenli erişim noktalarından görün; dar ve riskli yerlere girmeyin.'],['Karaman’a dönüş • dinlenme','17:00','18:00',START,'Günün son ayağı. Akşamı boş bırakın.']]},Salı:{theme:'Konya • Mevlâna • Şems • Selçuklu merkezi',tempo:'Orta / şehir içi',stops:[['Karaman → Konya','08:00','09:30','Mevlana Müzesi, Konya','Tek parça sürüş. İhtiyaç halinde kısa mola.'],['Mevlâna Müzesi / Dergâh','09:30','11:00','Mevlana Müzesi, Konya','Ana ziyaret. Türbe, dergâh ve avluyu sakin tempoda gezin.'],['Dinlenme • su • tuvalet','11:00','11:20','Mevlana Müzesi, Konya','Herkesin toplandığını kontrol edin.'],['Şems-i Tebrizi Türbesi','11:20','12:00','Şems-i Tebrizi Türbesi, Konya','Kısa ziyaret. Yürüyüş zor gelirse araç yaklaşımı tercih edilir.'],['Aziziye Camii','12:00','12:25','Aziziye Camii, Konya','Kısa mimari durak.'],['Öğle yemeği • Konya mutfağı','12:30','13:40','Konya merkez','Etli ekmek veya fırın kebabı. Servis hızına göre alternatif seçin.'],['Karatay Medresesi','13:50','14:35','Karatay Medresesi, Konya','Selçuklu mimarisi ve çini işçiliği.'],['Alaaddin Tepesi','14:45','15:20','Alaaddin Tepesi, Konya','Kısa seyir ve oturma molası.'],['Konya → Karaman • dönüş','15:20','17:00',START,'Dönüşten sonra yeni program eklemeyin.']]},Çarşamba:{theme:'Yerköprü Şelalesi • piknik • serbest doğa',tempo:'Rahat / doğa günü',stops:[['Karaman → Yerköprü (Hadim/Konya)','09:00','10:30','Yerköprü Şelalesi, Hadim, Konya','Hedef kesin olarak Hadim/Konya Yerköprü Şelalesidir. Mut’taki Yerköprü değildir.'],['Yerköprü Şelalesi • ziyaret','10:30','11:30','Yerköprü Şelalesi, Hadim, Konya','Seyir alanına kontrollü yürüyüş. Kaygan zemine ve dik kenarlara yaklaşmayın.'],['Piknik + serbest gezi + dinlenme','11:30','14:30','Yerköprü Şelalesi, Hadim, Konya','Aynı sahada uzun mola: piknik, çay, sohbet, fotoğraf ve kısa serbest dolaşım. Ayrı piknik noktası aramıyoruz.'],['Yerköprü → Karaman • dönüş','14:30','16:30',START,'İhtiyaç halinde dönüşte kısa mola. Akşamı boş bırakın.']]},Perşembe:{theme:'Ermenek • Zeyve Pazarı • baraj',tempo:'Uzun yol / rahat',stops:[['Karaman → Ermenek','08:00','10:15','Ermenek, Karaman','Uzun sürüş. Su ve ihtiyaç kontrolü; gerekirse kısa mola.'],['Ermenek merkez • mola','10:15','10:50','Ermenek merkez, Karaman','Çay/kahve ve tuvalet molası.'],['Ermenek → Zeyve Pazarı','10:50','11:35','Zeyve Pazarı, Ermenek, Karaman','Pazar alanına geçiş; grup araçtan indikten sonra toplansın.'],['Zeyve Pazarı • tanıma','11:35','12:15','Zeyve Pazarı, Ermenek, Karaman','Çınarlar, su kaynakları, değirmenler ve pazar dokusu.'],['Dere • değirmenler • dinlenme','12:15','12:50','Zeyve Pazarı, Ermenek, Karaman','Su kenarında oturun; kaygan taşlara ve dere yatağına yaklaşmayın.'],['Öğle yemeği • Zeyve','12:50','14:10','Zeyve Pazarı, Ermenek, Karaman','Uzun oturma molası. Zeyve kebabı bulunuyorsa denenebilir.'],['Çay • serbest zaman','14:10','14:45','Zeyve Pazarı, Ermenek, Karaman','Yöresel ürün alışverişi ve dinlenme.'],['Zeyve → Ermenek Barajı','14:45','15:30','Ermenek Barajı, Karaman','Güvenli seyir noktasında manzara.'],['Baraj manzarası • fotoğraf','15:30','16:15','Ermenek Barajı, Karaman','Kısa seyir ve fotoğraf. Kenarlarda güvenli sınır dışına çıkmayın.'],['Ermenek → Karaman • dönüş','16:15','18:30',START,'Uzun dönüş. Akşam başka program planlamayın.']]}};
let day='Pazartesi';const KEY='karaman-v12-state';let S=JSON.parse(localStorage.getItem(KEY)||'{}');const save=()=>localStorage.setItem(KEY,JSON.stringify(S));const mins=t=>{let[a,b]=t.split(':').map(Number);return a*60+b};const fmt=n=>{n=(n+1440)%1440;return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')};const key=i=>day+'-'+i;
function routeUrl(o,d){let a=COORD[o]||o,b=COORD[d]||d;return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(a)+'&destination='+encodeURIComponent(b)+'&travelmode=driving'}function fullUrl(){let p=[START,...DAYS[day].stops.map(x=>x[3])],u=[];p.forEach(x=>{if(!u.includes(x))u.push(x)});let o=COORD[u[0]]||u[0],d=COORD[u.at(-1)]||u.at(-1),w=u.slice(1,-1).map(x=>COORD[x]||x);return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(o)+'&destination='+encodeURIComponent(d)+(w.length?'&waypoints='+encodeURIComponent(w.join('|')):'')+'&travelmode=driving'}
function render(){document.getElementById('days').innerHTML=Object.keys(DAYS).map(d=>`<button class="${d===day?'active':''}" onclick="setDay('${d}')">${d}</button>`).join('');let D=DAYS[day],done=D.stops.filter((_,i)=>S[key(i)]?.done).length,skip=D.stops.filter((_,i)=>S[key(i)]?.skip).length,html=`<section class="card hero"><h2>${day}</h2><div class="lead"><b>${D.theme}</b><br>Tempo: ${D.tempo}<br>İlk rota: <b>${START}</b> → ilk durak. Sonraki her rota <b>bir önceki durak → mevcut durak</b> şeklindedir.</div><div class="stats"><div class="stat"><b>${D.stops.length}</b><span>durak</span></div><div class="stat"><b>${done}</b><span>yapıldı</span></div><div class="stat"><b>${skip}</b><span>atlandı</span></div></div><a class="route" href="${fullUrl()}" target="_blank">🗺️ Günün bütün duraklarını tek rotada aç</a></section>`;D.stops.forEach((x,i)=>{let st=S[key(i)]||{},origin=i?D.stops[i-1][3]:START,cls=st.done?'done':st.skip?'skip':'';html+=`<article class="card stop ${cls}"><div class="meta">${i+1}. DURAK</div><h3>${x[0]}</h3><div class="time">${x[1]} – ${x[2]}</div><div class="meta">${origin} → ${x[3]}</div><div class="details"><strong>Burada ne yapacağız?</strong><p>${x[4]}</p><strong>Tempo / grup notu</strong><p>${D.tempo}. Yaşlı misafirleri zorlamayın; ihtiyaç molasında saati kaydırın.</p></div><a class="route" href="${routeUrl(origin,x[3])}" target="_blank">🧭 Bu durağa rotayı aç</a><div class="actions"><button class="doneBtn" onclick="mark(${i},'done')">${st.done?'✓ Yapıldı':'Yapıldı'}</button><button class="skipBtn" onclick="mark(${i},'skip')">${st.skip?'✓ Atlandı':'Atla'}</button><button class="delayBtn" onclick="delay(${i},15)">+15 dk</button><button class="activeBtn" onclick="mark(${i},'active')">${st.active?'● Aktif':'Aktif yap'}</button></div><textarea class="note" placeholder="Bu durakla ilgili saha notu..." oninput="note(${i},this.value)">${st.note||''}</textarea></article>`});html+=`<section class="card add"><h3>➕ Sonradan durak ekle</h3><div class="lead">Sadece gitmek istediğiniz yerin adını yazın. Adres, mesafe veya ziyaret süresi bilmenize gerek yok. Sistem yeri bulup aktif/yapılmış son durağın altına ekler ve yol/ziyaret süresini hesaplar.</div><input id="newPlace" placeholder="Örn. Hatuniye Medresesi"><button onclick="addStop()">🧭 Yeri bul ve programa ekle</button><div class="warning">Harita servisi yolu ve konumu belirler; ziyaret süresi yerin türüne göre tahmindir.</div></section><section class="card"><h3>☑ Günlük kontrol listesi</h3><div class="checklist">${['Su ve kişisel ihtiyaçlar kontrol edildi','Araç / anahtar / telefon kontrol edildi','Yaşlı misafirlerin oturma ve dinlenme ihtiyacı kontrol edildi','Bir sonraki durağın yol durumu kontrol edildi','Gün sonunda eksik kalanlar not edildi'].map((t,i)=>{let k=day+'-check-'+i,v=!!S[k];return `<label class="check ${v?'done':''}"><input type="checkbox" ${v?'checked':''} onchange="check('${k}',this.checked)"><span>${t}</span></label>`}).join('')}</div></section>`;document.getElementById('app').innerHTML=html}
function setDay(d){day=d;render()}function mark(i,t){let k=key(i);S[k]=S[k]||{};if(t==='active'){Object.keys(S).filter(k=>k.startsWith(day+'-')).forEach(k=>{if(S[k])S[k].active=false});S[k].active=true}else{S[k][t]=!S[k][t];if(t==='done'&&S[k].done)S[k].skip=false;if(t==='skip'&&S[k].skip)S[k].done=false}save();render()}function delay(i,n){for(let j=i;j<DAYS[day].stops.length;j++){let x=DAYS[day].stops[j];x[1]=fmt(mins(x[1])+n);x[2]=fmt(mins(x[2])+n)}render()}function note(i,v){let k=key(i);S[k]=S[k]||{};S[k].note=v;save()}function check(k,v){S[k]=v;save();render()}function resetDay(){Object.keys(S).filter(k=>k.startsWith(day+'-')).forEach(k=>delete S[k]);save();render()}
async function geo(q){let r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=tr&accept-language=tr&q='+encodeURIComponent(q+', Türkiye'));let a=await r.json();if(!a.length)throw Error();return a[0]}async function osrm(a,b){let r=await fetch('https://router.project-osrm.org/route/v1/driving/'+a.lon+','+a.lat+';'+b.lon+','+b.lat+'?overview=false'),j=await r.json();if(j.code!=='Ok')throw Error();return Math.max(5,Math.ceil(j.routes[0].duration/60)+5)}function stay(n){n=n.toLocaleLowerCase('tr-TR');if(/cami|türbe|mescit/.test(n))return 25;if(/müze/.test(n))return 45;if(/kale/.test(n))return 45;if(/şelale|park|mesire|göl|baraj|doğa/.test(n))return 60;if(/pazar|çarşı/.test(n))return 60;if(/yemek|restoran|lokanta/.test(n))return 75;if(/kilise|ören|antik|manastır|höyük/.test(n))return 50;return 40}
async function addStop(){let inp=document.getElementById('newPlace'),name=inp.value.trim();if(!name)return alert('Sadece yer adını yazın.');try{let D=DAYS[day],idx=0;D.stops.forEach((_,i)=>{let s=S[key(i)]||{};if(s.active||s.done)idx=i});let origin=D.stops[idx][3],g=await geo(name),from=COORD[origin]?(()=>{let[a,b]=COORD[origin].split(',');return{lat:a,lon:b}})():await geo(origin),travel=await osrm(from,{lat:g.lat,lon:g.lon}),st=stay(name),at=idx+1,end=mins(D.stops[idx][2]);D.stops.splice(at,0,[name,fmt(end+travel),fmt(end+travel+st),g.display_name||name,g.display_name||name]);render();alert(name+' programa eklendi. '+travel+' dk yol + '+st+' dk ziyaret süresi ayrıldı.');inp.value=''}catch(e){alert('Yer bulunamadı veya rota hesaplanamadı. Örneğin "Hatuniye Medresesi, Karaman" gibi daha açık yazın.')}}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=12').catch(()=>{});
</script></body></html>
