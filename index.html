<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15191e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Karaman Gezi Kontrol</title>
<style>
:root{--dark:#15191e;--bg:#f3f5f7;--card:#fff;--line:#dfe3e7;--muted:#66717c;--gold:#a96f12;--green:#2f7d46;--red:#b3261e;--blue:#225b8f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#182028;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:86px}header{background:var(--dark);color:#fff;padding:18px 16px;position:sticky;top:0;z-index:20}header h1{font-size:22px;margin:0 0 5px}header p{margin:0;font-size:13px;line-height:1.45;opacity:.88}.days{display:flex;gap:7px;overflow:auto;padding:10px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:91px;z-index:15}.days button{border:0;border-radius:12px;padding:11px 14px;font-weight:800;white-space:nowrap;background:#eee}.days button.active{background:var(--dark);color:#fff}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;margin:10px;padding:15px;box-shadow:0 1px 2px #00000008}.hero{border-left:5px solid var(--gold);background:linear-gradient(135deg,#fff,#faf5e9)}h2{margin:0 0 7px;font-size:23px}.lead{font-size:14px;line-height:1.5}.notice{background:#fff7df;border:1px solid #ead59a;border-radius:12px;padding:12px;margin:10px;font-size:13px;line-height:1.5}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.stat{background:#f7f8f9;border-radius:11px;padding:9px;text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--muted)}.stop h3{margin:3px 0;font-size:18px}.time{font-size:19px;font-weight:900}.meta{font-size:12px;color:var(--muted);margin:5px 0}.details{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}.details p{font-size:13px;line-height:1.55;margin:6px 0}.details strong{display:block;margin-top:9px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.actions button,.route,.bottom button,.add button{border:0;border-radius:12px;padding:12px;font-weight:900;font-size:14px;text-align:center}.done{background:#dff1e2}.skip{background:#fde2df}.delay{background:#eee}.active{background:#e3eef8}.route{display:block;text-decoration:none;background:var(--dark);color:#fff;margin-top:8px}.stop.isdone{border-left:5px solid var(--green)}.stop.isskip{border-left:5px solid var(--red);opacity:.72}.note{width:100%;min-height:65px;margin-top:9px;border:1px solid #ccd2d7;border-radius:10px;padding:9px;font:inherit}.tips{display:grid;gap:7px}.tip{background:#f7f8f9;border-radius:10px;padding:10px;font-size:12px;line-height:1.45}.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--dark);padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px;z-index:30}.bottom button{background:#fff;color:#182028}.checklist{display:grid;gap:7px;margin-top:10px}.check{display:flex;align-items:center;gap:10px;background:#f7f8f9;border-radius:10px;padding:10px;font-size:13px}.check input{width:22px;height:22px;accent-color:var(--green);flex:0 0 auto}.check.done{text-decoration:line-through;opacity:.6}.add{border:2px dashed #c8ced4}.add input,.add textarea{width:100%;border:1px solid #cbd1d6;border-radius:10px;padding:11px;margin:5px 0;font:inherit;background:#fff}.add button{background:var(--dark);color:#fff;width:100%;margin-top:5px}.addgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.custom{border-left:5px solid var(--blue)}.warning{font-size:12px;color:#7a5b00;margin-top:7px}
@media print{body{background:#fff;padding:0}.bottom,.days,.actions,.route,.add{display:none!important}header{position:static}.card{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>
<header><h1>Karaman Gezi Kontrol</h1><p>Başlangıç / dönüş: <strong>İstasyon Caddesi 241 Sokak No:6, Karaman</strong><br>Yaşlı misafirler için kontrollü tempo • Program sahada değiştirilebilir</p></header>
<nav class="days" id="days"></nav>
<main id="app"></main>
<div class="bottom"><button onclick="showTools()">⚙ Araçlar</button><button onclick="makePDF()">📄 Gün Sonu PDF</button></div>
<script>
'use strict';
const START='İstasyon Caddesi 241 Sokak No:6, Karaman, Türkiye';
const DATA={
Pazartesi:{theme:'Karaman tarihi • Taşkale • Manazan',tempo:'Orta / kontrollü',stops:[
['Karaman Kalesi','09:15','09:50','drive','Karaman Kalesi, Karaman','Şehri yukarıdan görmek ve Karaman tarihine giriş. Araçtan indikten sonra kısa seyir molası verin; yaşlı misafirleri yokuşa zorlamayın.'],
['Aktekke Camii / Mümine Hatun Türbesi','10:05','10:35','walk','Aktekke Camii, Karaman','Mümine Hatun Türbesi için sakin ve kısa ziyaret. Cami adabına uygun hareket edin; grup girişte ve çıkışta yeniden toplansın.'],
['Yunus Emre Camii ve Türbesi','10:40','11:10','walk','Yunus Emre Camii ve Türbesi, Karaman','Kısa tarih anlatımı, ziyaret ve oturma molası. Burayı uzun yürüyüşe çevirmeyin.'],
['Tartan Konağı','11:15','12:00','walk','Tartan Konağı, Karaman','Konağın planını, kalem işi süslemelerini ve geleneksel yaşam izlerini inceleyin. Açılış/ziyaret durumunu sahada kontrol edin.'],
['Öğle yemeği • yöresel tatlar','12:05','13:20','drive','Karaman merkez','Öncelik rahat oturma, temiz tuvalet ve servis hızıdır. Calla varsa tadılabilir; etli ekmek daha hızlı bir seçenek olabilir.'],
['Taşkale Tahıl Ambarları','14:05','15:00','drive','Taşkale Tahıl Ambarları, Karaman','Kaya içine oyulmuş tahıl ambarlarını güvenli seyir noktalarından inceleyin. Tırmanma ve denge gerektiren bölümlerde kimseyi zorlamayın.'],
['Manazan Mağaraları','15:15','16:00','drive','Manazan Mağaraları, Karaman','Kaya yerleşiminin yapısını güvenli erişim noktalarından görün. Dar, eğimli veya riskli yerlere girmeyin.'],
['Karaman’a dönüş • dinlenme','16:00','17:00','drive',START,'Günün son ayağı. Dönüşten sonra yeni gezi eklemeyin; akşamı dinlenmeye bırakın.']]},
Salı:{theme:'Konya • Mevlâna • Şems • merkez',tempo:'Orta / şehir içi',stops:[
['Karaman → Konya','08:00','09:30','drive','Mevlana Müzesi, Konya','Kahvaltı sonrası tek parça sürüş. İhtiyaç halinde kısa mola verin. Konya’da otoparkı önceleyip yürüyüşü azaltın.'],
['Mevlâna Müzesi / Dergâh','09:30','11:00','walk','Mevlana Müzesi, Konya','Gezinin ana ziyareti. Türbe, dergâh ve avluyu sakin tempoda gezin. Oturma ve su molalarını ihmal etmeyin.'],
['Dinlenme • su • tuvalet','11:00','11:20','walk','Mevlana Müzesi çevresi, Konya','Herkesin toplandığını kontrol edin. Bu mola programın zorunlu parçasıdır.'],
['Şems-i Tebrizi Türbesi','11:20','12:00','walk','Şems-i Tebrizi Türbesi, Konya','Kısa ziyaret. Yürüyüş zor gelirse araçla yaklaşım tercih edilebilir.'],
['Aziziye Camii','12:00','12:25','walk','Aziziye Camii, Konya','Kısa mimari durak. Dış cephe ve iç mekânı sakin biçimde görün; uzun yürüyüş yok.'],
['Öğle yemeği • Konya mutfağı','12:30','13:40','drive','Konya merkez','Etli ekmek veya fırın kebabı. Kalabalık ve servis hızına göre alternatif seçin.'],
['Karatay Medresesi','13:50','14:35','drive','Karatay Medresesi, Konya','Selçuklu mimarisi ve çini işçiliğine odaklanın. Kapalıysa programı uzatmadan dışarıdan devam edin.'],
['Alaaddin Tepesi','14:45','15:20','drive','Alaaddin Tepesi, Konya','Kısa seyir ve oturma molası. Uzun yürüyüş yok.'],
['Konya → Karaman • dönüş','15:20','17:00','drive',START,'Dönüşte yeni durak eklemeyin. Akşam serbest.']]},
Çarşamba:{theme:'Yerköprü Şelalesi • piknik • doğa',tempo:'Rahat / doğa günü',stops:[
['Karaman → Yerköprü','09:00','10:30','drive','Yerköprü Şelalesi, Hadim, Konya','Piknik malzemeleri, su, sandalye/katlanır tabure ve uygun ayakkabı kontrolü yapılır.'],
['Yerköprü Şelalesi','10:30','11:20','walk','Yerköprü Şelalesi, Hadim, Konya','Manzara noktasına kontrollü yürüyüş. Grup tek parça ilerlesin; yaşlı misafirleri yalnız bırakmayın.'],
['Dinlenme ve çay','11:20','12:00','walk','Yerköprü Şelalesi, Hadim, Konya','Oturma, su, çay ve fotoğraf. Bu mola tekrar yürüyüşe çevrilmesin.'],
['Piknik öğle yemeği','12:00','14:15','walk','Yerköprü Şelalesi, Hadim, Konya','Acele etmeyen uzun mola. Çöp poşeti, peçete, su ve içecekleri hazır tutun.'],
['Serbest doğa zamanı','14:15','15:00','walk','Yerköprü Şelalesi, Hadim, Konya','Yakın çevrede fotoğraf ve kısa yürüyüş. Islak/kaygan zemine yaklaşmayın; suya girme planı yok.'],
['Yerköprü → Karaman • dönüş','15:00','17:00','drive',START,'Dönüşte ihtiyaç molası verilebilir. Akşamı boş bırakın.']]},
Perşembe:{theme:'Ermenek • Zeyve Pazarı • baraj manzarası',tempo:'Uzun yol / rahat',stops:[
['Karaman → Ermenek','08:00','10:15','drive','Ermenek, Karaman','Uzun sürüş. Araç içinde su ve ihtiyaç kontrolü yapın; gerekirse 10–15 dakikalık ek mola verilebilir.'],
['Ermenek merkez • mola','10:15','10:50','drive','Ermenek merkez, Karaman','Çay/kahve, tuvalet ve kısa ihtiyaç molası.'],
['Ermenek → Zeyve Pazarı','10:50','11:35','drive','Zeyve Pazarı, Ermenek, Karaman','Pazar alanına geçiş. Araçtan indikten sonra grup tek noktada toplansın.'],
['Zeyve Pazarı • tanıma','11:35','12:15','walk','Zeyve Pazarı, Ermenek, Karaman','Tarihi çınarlar, su kaynakları, değirmenler ve pazar dokusunu görün. Fotoğraf için serbest ama grup dağılmasın.'],
['Dere • değirmenler • dinlenme','12:15','12:50','walk','Zeyve Pazarı, Ermenek, Karaman','Su kenarında oturun. Kaygan taşlara ve dere yatağına yaklaşmayın.'],
['Öğle yemeği • Zeyve','12:50','14:10','walk','Zeyve Pazarı, Ermenek, Karaman','Yörede taze olanı tercih edin. Zeyve kebabı bulunuyorsa denenebilir. Uzun oturma molası yaşlı misafirler için faydalıdır.'],
['Çay • serbest zaman','14:10','14:45','walk','Zeyve Pazarı, Ermenek, Karaman','Temponun düşürüldüğü bilinçli mola. Yöresel ürün alışverişi için kullanılabilir.'],
['Zeyve → Ermenek Barajı','14:45','15:30','drive','Ermenek Barajı, Karaman','Manzara için araçla geçiş. Yol ve görüş şartlarına göre güvenli seyir noktası seçin.'],
['Baraj manzarası • fotoğraf','15:30','16:15','walk','Ermenek Barajı, Karaman','Kısa seyir, fotoğraf ve oturma. Kenarlarda güvenli sınırların dışına çıkmayın.'],
['Ermenek → Karaman • dönüş','16:15','18:30','drive',START,'Uzun dönüş. Akşam başka program planlamayın.']]}
};
let day='Pazartesi';
const state=JSON.parse(localStorage.getItem('karamanStateV5')||'{}');
function save(){localStorage.setItem('karamanStateV5',JSON.stringify(state));}
function key(d,i){return d+'_'+i}
function min(t){const p=t.split(':');return +p[0]*60 + +p[1]}
function fmt(n){n=(n+1440)%1440;return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function routeOrigin(d,id,custom){
const base=DATA[d].stops;
const customs=(state.custom&&state.custom[d])||[];
if(!custom){const n=Number(id);return n<=0?START:base[n-1][4]}
const ci=customs.findIndex(x=>x.id===id);
if(ci<=0)return base.at(-1)[4];
return customs[ci-1].place;
}
function mapPlace(place){
const p=String(place||'');
if(p.includes('Yerköprü Şelalesi'))return '37.028579,32.701243';
return p;
}
function mapUrl(origin,place,mode){return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(origin)+'&destination='+encodeURIComponent(mapPlace(place))+'&travelmode='+(mode==='walk'?'walking':'driving')}
function renderDays(){document.getElementById('days').innerHTML=Object.keys(DATA).map(d=>'<button class="'+(d===day?'active':'')+'" onclick="day=\''+d+'\';render()">'+d+'</button>').join('')}
function render(){renderDays();const D=DATA[day];const base=D.stops.map((s,i)=>({x:s,st:state[key(day,i)]||{},i,custom:false}));const custom=(state.custom&&state.custom[day]||[]).map(x=>({x:[x.name,x.start,x.end,x.mode,x.place,x.desc],st:state[x.id]||{},i:x.id,custom:true}));const stops=base.concat(custom);const completed=stops.filter(o=>o.st.done).length;const skipped=stops.filter(o=>o.st.skip).length;
let html='<section class="card hero"><h2>'+esc(D.theme)+'</h2><div class="lead">Tempo: <b>'+esc(D.tempo)+'</b><br>Günün amacı: Yaşlı misafirleri zorlamadan, uzun oturma ve su molalarıyla programı kontrollü yürütmek.</div><div class="stats"><div class="stat"><b>'+stops.length+'</b><span>durak</span></div><div class="stat"><b>'+completed+'</b><span>yapıldı</span></div><div class="stat"><b>'+skipped+'</b><span>atlandı</span></div></div></section>';
html+='<div class="notice"><b>Saha kuralı:</b> Grubun rahatlığı programdan önce gelir. Bir durak atlanabilir, süre uzatılabilir veya aşağıdaki bölümden yeni bir yer eklenebilir.</div>';
html+='<section class="card"><h2>☑ Günlük kontrol listesi</h2><div class="checklist">'+['Araç yakıtı ve lastikler kontrol edildi','Su ve kişisel ilaçlar alındı','Telefonlar şarj edildi / powerbank hazır','Yaşlı misafirlerin oturma ve tuvalet ihtiyacı planlandı','Hava ve yol koşulları kontrol edildi','Günün dönüş saati gruba bildirildi'].map((t,i)=>{const on=!!state['check_'+day+'_'+i];return '<label class="check '+(on?'done':'')+'"><input type="checkbox"'+(on?' checked':'')+' onchange="toggleCheck('+i+')">'+esc(t)+'</label>'}).join('')+'</div></section>';
html+=stops.map(o=>{const x=o.x,st=o.st,id=String(o.i);return '<article class="card stop '+(st.done?'isdone ':'')+(st.skip?'isskip ':'')+(o.custom?'custom':'')+'"><div class="time">'+esc(x[1])+' – '+esc(x[2])+'</div><h3>'+esc(x[0])+'</h3><div class="meta">'+(x[3]==='drive'?'🚗 Araç':'🚶 Yürüyüş')+' • '+(st.done?'Yapıldı':st.skip?'Atlandı':'Planlandı')+(o.custom?' • SAHADA EKLENDİ':'')+'</div><div class="details"><p><strong>📍 Konum</strong>'+esc(x[4])+'</p><p><strong>🎯 Burada ne yapacağız?</strong>'+esc(x[5])+'</p><p><strong>⏱ Planlanan süre</strong>'+esc(x[6]||(((min(x[2])-min(x[1])+1440)%1440)+' dk'))+'</p></div><div class="actions"><button class="active" onclick="markActive('+JSON.stringify(id)+')">▶ Aktif</button><button class="done" onclick="markDone('+JSON.stringify(id)+')">✓ Yapıldı</button><button class="skip" onclick="markSkip('+JSON.stringify(id)+')">✕ Atla</button><button class="delay" onclick="delay('+JSON.stringify(id)+')">+15 dk</button></div><a class="route" target="_blank" href="'+mapUrl(routeOrigin(day,o.i,o.custom),x[4],x[3])+'">📍 Bu durağa haritayı aç</a><textarea class="note" placeholder="Saha notu: ne oldu, ne değişti?" onchange="setNote('+JSON.stringify(id)+',this.value)">'+esc(st.note||'')+'</textarea></article>'}).join('');
html+='<section class="card add"><h2>➕ Sonradan durak ekle</h2><div class="lead">Aklınıza sonradan gelen yeri yazın. Sistem onu <b>mevcut programın sonuna</b> ekler ve yol + kalış süresine göre yeni saatini hesaplar. Böylece gezi sırasında planı baştan yazmanız gerekmez.</div><input id="newName" placeholder="Örn. Hatuniye Medresesi"><input id="newPlace" placeholder="Haritadaki yer / açık adres"><div class="addgrid"><input id="travel" type="number" min="0" value="20" placeholder="Yol süresi (dk)"><input id="stay" type="number" min="5" value="30" placeholder="Kalış süresi (dk)"></div><textarea id="newDesc" placeholder="Burada ne yapacağız? Örn. 30 dk ziyaret + fotoğraf + oturma molası"></textarea><button onclick="addStop()">📌 Bu durağı programa ekle</button><div class="warning">Saatler tahminidir. Gerçek yol süresini trafik, yol ve grubun temposuna göre sahada düzeltin.</div></section>';
html+='<section class="card"><h2>💡 Grup için rehber notları</h2><div class="tips"><div class="tip">Her 60–90 dakikada bir oturma, su veya tuvalet ihtiyacını kontrol edin.</div><div class="tip">Yürüyüşte bir kişi önde, bir kişi arkada olsun; grup kopmasın.</div><div class="tip">Bir durakta 15–20 dakika fazla kalmak sorun değildir. Sonraki durağı kısaltmak veya atlamak daha doğrudur.</div><div class="tip">Dönüş saatini zorlamayın. Son durak dönüş ve dinlenmedir.</div></div></section>';
document.getElementById('app').innerHTML=html;save()}
function toggleCheck(i){state['check_'+day+'_'+i]=!state['check_'+day+'_'+i];save();render()}
function markActive(i){state[key(day,i)]={...(state[key(day,i)]||{}),active:true,skip:false};save();render()}
function markDone(i){state[key(day,i)]={...(state[key(day,i)]||{}),done:true,skip:false};save();render()}
function markSkip(i){state[key(day,i)]={...(state[key(day,i)]||{}),skip:true,done:false};save();render()}
function delay(i){const s=state[key(day,i)]||{};s.delay=(s.delay||0)+15;state[key(day,i)]=s;save();alert('15 dakikalık ek süre kaydedildi. Sonraki plan değişikliklerinde bu not dikkate alınacaktır.');render()}
function setNote(i,v){state[key(day,i)]={...(state[key(day,i)]||{}),note:v};save()}
function addStop(){const name=document.getElementById('newName').value.trim();const place=document.getElementById('newPlace').value.trim()||name;const travel=Math.max(0,+document.getElementById('travel').value||20);const stay=Math.max(5,+document.getElementById('stay').value||30);const desc=document.getElementById('newDesc').value.trim()||'Kısa ziyaret, fotoğraf ve grubun ihtiyacına göre dinlenme.';if(!name){alert('Önce gitmek istediğiniz yeri yazın.');return}if(!state.custom)state.custom={};if(!state.custom[day])state.custom[day]=[];const arr=state.custom[day];let end=min(DATA[day].stops.at(-1)[2]);if(arr.length)end=min(arr.at(-1).end);const start=end+travel;const id=day+'_custom_'+Date.now();arr.push({id,name,start:fmt(start),end:fmt(start+stay),mode:'drive',place,desc});save();render();setTimeout(()=>document.getElementById('newName')?.scrollIntoView({behavior:'smooth',block:'center'}),100)}
function showTools(){alert('Araçlar\n\n• Duraklarda Yapıldı / Atla / +15 dk kullanın.\n• Saha notlarını yazın; gün sonunda yazdırılabilir rapora aktarılır.\n• Sonradan durak ekleme bölümünden yeni yer ekleyin.\n• Harita butonu Google Maps’i açar.\n• Değişiklikler bu telefonda saklanır.')}
function makePDF(){window.print()}
render();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(function(){})}</script>
</body>
</html>
